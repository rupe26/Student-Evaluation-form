<html lang="mr">
<head>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Header Styles */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .page-header h1 {
            color: #0056b3;
            margin: 0;
            text-align: center;
            font-size: 26px;
        }
        h2, h3 { text-align: center; color: #0056b3; }
        
        /* Form Header Styles */
        .form-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .form-group { display: flex; align-items: center; }
        .form-group label {
            font-weight: bold;
            margin-right: 10px;
            white-space: nowrap;
            color: #0056b3;
        }
        .form-group input, .form-group select {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 5px;
            gap: 15px;
        }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: flex-end;}
        select, input[type="text"], input[type="date"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        .class-selector { flex: 1; min-width: 250px; }
        .class-selector select { width: auto; font-size: 16px; font-weight: bold; padding: 8px; }
        
        /* Desktop Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            table-layout: fixed; 
        }
        th, td {
            border: 1px solid #000;
            padding: 6px;
            text-align: left;
            vertical-align: middle;
        }
        th { background-color: #f2f2f2; text-align: center; font-size: 14px; }
        
        td select {
            width: 100%;
            white-space: normal;
            word-wrap: break-word;
            font-size: 11px;
            cursor: pointer;
            background-color: #fff;
            height: auto;
        }
        optgroup { font-weight: bold; color: #0056b3; background-color: #f2f2f2; }
        option { color: #333; background-color: #fff; }
        
        /* Button Styles */
        .btn {
            padding: 10px 15px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-add { background-color: #28a745; }
        .btn-add:hover { background-color: #218838; }
        .btn-download { background-color: #dc3545; }
        .btn-download:hover { background-color: #c82333; }
        .btn-save { background-color: #17a2b8; }
        .btn-save:hover { background-color: #117a8b; }
        .btn-load { background-color: #fd7e14; }
        .btn-load:hover { background-color: #e85e0b; }
        .btn-sync { background-color: #6f42c1; }
        .btn-sync:hover { background-color: #59339d; }
        
        /* Summary Table Styles */
        .summary-container { margin-top: 30px; background: #e9ecef; padding: 15px; border-radius: 5px; }
        .summary-table { width: 100%; border-collapse: collapse; background-color: white; }
        .summary-table th { background-color: #0056b3; color: white; text-align: center; padding: 8px;}
        .summary-table td { text-align: center; font-size: 15px; font-weight: bold; background-color: white; padding: 8px;}
        .summary-block { page-break-inside: avoid; margin-bottom: 20px; }
        .grand-total-block {
            page-break-inside: avoid; margin-top: 30px; border: 2px solid #28a745;
            padding: 15px; border-radius: 5px; background-color: #f8fff9;
        }
        .grand-total-block th { background-color: #28a745 !important; }
        .grand-total-block h4 {
            color: #28a745; border-bottom: 2px solid #28a745; display: inline-block;
            padding-bottom: 3px; margin-top: 0; margin-bottom: 10px;
        }

        /* ========================================== */
        /* 📱 MOBILE RESPONSIVENESS (Data Feeding)   */
        /* ========================================== */
        @media (max-width: 850px) {
            body { margin: 10px; }
            .container { padding: 10px; }
            .form-header { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
            .controls { flex-direction: column; align-items: stretch; }
            .btn-group { flex-direction: column; justify-content: stretch; width: 100%; }
            .btn { width: 100%; font-size: 16px; padding: 12px; }

            /* Card-based table for mobile */
            #evaluationTable thead { display: none; }
            #evaluationTable, #evaluationTable tbody, #evaluationTable tr, #evaluationTable td {
                display: block; width: 100%; box-sizing: border-box;
            }
            #evaluationTable tr {
                margin-bottom: 20px;
                border: 2px solid #0056b3;
                border-radius: 8px;
                background: #fff;
                overflow: hidden;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }
            #evaluationTable td {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                padding: 12px;
                border: none;
                border-bottom: 1px solid #eaeaea;
            }
            #evaluationTable td:last-child { border-bottom: none; }
            #evaluationTable td::before {
                content: attr(data-label);
                font-weight: bold;
                color: #0056b3;
                margin-bottom: 6px;
                font-size: 14px;
            }
            #evaluationTable td select, #evaluationTable td input {
                font-size: 14px;
                padding: 10px;
                background-color: #f8f9fa;
                border: 1px solid #ced4da;
            }
            td select { white-space: normal; height: auto; }
        }

        /* ========================================== */
        /* 🖨️ PDF & PRINT FORMATTING                */
        /* ========================================== */
        .print-span { display: none; } /* Hidden normally, used for perfect PDF generation */

        @media print {
            @page { size: portrait; margin: 8mm; }
            body { background-color: white; margin: 0; }
            .container { box-shadow: none; width: 100%; max-width: 100%; padding: 0; }
            .controls, .no-print, .btn-group { display: none !important; }
            
            .page-header h1 { font-size: 20px; color: black !important; margin-bottom: 10px;}
            .form-header { border: none; background-color: transparent; padding: 0; margin-bottom: 10px; gap: 8px; }
            .form-group label { font-size: 12px; }
            
            /* Print Span styling (replaces inputs) */
            .print-span {
                display: block !important;
                font-size: 10.5px;
                line-height: 1.3;
                color: black;
                white-space: normal;
                word-wrap: break-word;
                padding: 2px 0;
            }
            .form-group .print-span { border-bottom: 1px dashed #000; flex: 1; padding-left: 5px; font-size: 12px;}

            /* Force standard table layout even if printed from mobile */
            #evaluationTable, #evaluationTable tbody, #evaluationTable tr, #evaluationTable td {
                display: table !important; width: 100% !important; box-sizing: border-box !important;

            #evaluationTable { display: table !important; margin-bottom: 10px !important; }
            #evaluationTable thead { display: table-header-group !important; }
            #evaluationTable tbody { display: table-row-group !important; }
            #evaluationTable tr { display: table-row !important; border: none !important; box-shadow: none !important; margin: 0 !important; }
            #evaluationTable th { display: table-cell !important; background-color: #f2f2f2 !important; color: black !important; -webkit-print-color-adjust: exact; padding: 4px; font-size: 11px; }
            #evaluationTable td { display: table-cell !important; border: 1px solid black !important; padding: 4px !important; text-align: left !important; }

    function populateSchoolDropdown() {
        const sel = document.getElementById('schoolSelect');
        sel.innerHTML = '<option value="">-- शाळा निवडा --</option>';
        schoolList.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.name;
            opt.textContent = `${s.name} (${s.code})`;
            sel.appendChild(opt);
        });
        const otherOpt = document.createElement('option');
        otherOpt.value = "__other__";
        otherOpt.textContent = "इतर (यादीत नसल्यास)";
        sel.appendChild(otherOpt);
    }
    
    function onSchoolChange() {
        const sel = document.getElementById('schoolSelect');
        if (sel.value === "__other__") {
            const customName = prompt("शाळेचे नाव टाका:");
            if (customName) {
                const opt = document.createElement('option');
                opt.value = customName;
                opt.textContent = customName;
                sel.insertBefore(opt, sel.lastElementChild);
                sel.value = customName;
            } else { sel.value = ""; }
        }
        populateTeacherDropdown(sel.value);
    }
    
    function populateTeacherDropdown(schoolName) {
        const sel = document.getElementById('teacherSelect');
        sel.innerHTML = '';
        if (!schoolName) {
            sel.innerHTML = '<option value="">-- आधी शाळा निवडा --</option>';
            return;
        }
        const teachers = teacherData[schoolName];
        if (!teachers || teachers.length === 0) {
            sel.innerHTML = '<option value="">-- या शाळेसाठी शिक्षक यादी उपलब्ध नाही --</option>';
            const otherOpt = document.createElement('option');
            otherOpt.value = "__other_teacher__";
            otherOpt.textContent = "इतर (नाव टाका)";
            sel.appendChild(otherOpt);
            return;
        }
        sel.innerHTML = '<option value="">-- शिक्षक निवडा --</option>';
        teachers.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.name;
            opt.textContent = `${t.name} (${t.designation})`;
            sel.appendChild(opt);
        });
        const otherOpt = document.createElement('option');
        otherOpt.value = "__other_teacher__";
        otherOpt.textContent = "इतर (यादीत नसल्यास)";
        sel.appendChild(otherOpt);
    }
    
    function onTeacherChange() {
        const sel = document.getElementById('teacherSelect');
        if (sel.value === "__other_teacher__") {
            const customName = prompt("शिक्षकाचे नाव टाका:");
            if (customName) {
                const opt = document.createElement('option');
                opt.value = customName;
                opt.textContent = customName;
                sel.insertBefore(opt, sel.lastElementChild);
                sel.value = customName;
            } else { sel.value = ""; }
        }
    }

        const selectedClass = document.getElementById('classSelect').value;

        </select>`;
    }

    function generateOptGroup(groupLabel, dataArray, prefix) {
        if (!dataArray) return '';
        let html = `<optgroup label="${groupLabel}">`;
        dataArray.forEach(text => {
            html += `<option value="${prefix} - ${text}" title="${prefix} - ${text}">${prefix} - ${text}</option>`;
        });
        html += `</optgroup>`;
        return html;
    }

    function createDropdown(subject) {
        const selectedClass = document.getElementById('classSelect').value;
        const optionsData = competencyData[selectedClass][subject];
        let html = `<select class="competency-select" data-subject="${subject}" title="क्षमता निवडण्यासाठी क्लिक करा">`;
        html += `<option value="">-- क्षमता निवडा --</option>`;
        html += generateOptGroup("गट A (प्रगत स्तर)", optionsData.A, "A");
        html += generateOptGroup("गट B (मध्यम स्तर)", optionsData.B, "B");
        html += generateOptGroup("गट C (आरंभिक स्तर)", optionsData.C, "C");
        html += `</select>`;
        return html;
    }

            <td data-label="लेखन गट (A/B/C)">${createDropdown('writing')}</td>
            <td data-label="संख्याज्ञान गट (A/B/C)">${createDropdown('numeracy')}</td>
            <td data-label="गणितीय क्रिया गट">${createDropdown('operations')}</td>
        `;
        tbody.appendChild(tr);
    }

    function generateSummary() {
        const classes = ["इयत्ता दुसरी", "इयत्ता तिसरी", "इयत्ता चौथी", "इयत्ता पाचवी"];
        const counts = {};
        const grandTotal = { reading: {A:0,B:0,C:0}, writing: {A:0,B:0,C:0}, numeracy: {A:0,B:0,C:0}, operations: {A:0,B:0,C:0} };
        
        classes.forEach(cls => { counts[cls] = { reading:{A:0,B:0,C:0}, writing:{A:0,B:0,C:0}, numeracy:{A:0,B:0,C:0}, operations:{A:0,B:0,C:0} }; });

        const rows = document.querySelectorAll('#tableBody tr');
        const classesPresent = new Set();

        rows.forEach(row => {
            const classSelect = row.querySelector('.class-dropdown').value;
            if (!classSelect) return; 
            classesPresent.add(classSelect);
            
            const selects = row.querySelectorAll('.competency-select');
            selects.forEach(select => {
                const subject = select.getAttribute('data-subject');
                const val = select.value;
                if (val.startsWith('A')) { counts[classSelect][subject].A++; grandTotal[subject].A++; }
                else if (val.startsWith('B')) { counts[classSelect][subject].B++; grandTotal[subject].B++; }
                else if (val.startsWith('C')) { counts[classSelect][subject].C++; grandTotal[subject].C++; }
            });
        });

        let summaryHTML = '';
        classes.forEach(cls => {
            if (classesPresent.has(cls)) {
                const c = counts[cls];
                summaryHTML += `
                    <div class="summary-block">
                        <h4 style="margin-bottom: 8px; color: #0056b3; border-bottom: 2px solid #0056b3; display: inline-block; padding-bottom: 3px;">${cls}</h4>
                        <table class="summary-table">
                            <thead><tr><th style="width: 20%;">विषय</th><th style="width: 20%;">गट A (प्रगत)</th><th style="width: 20%;">गट B (मध्यम)</th><th style="width: 20%;">गट C (आरंभिक)</th><th style="width: 20%;">एकूण नोंदणी</th></tr></thead>
                            <tbody>
                                <tr><td><strong>वाचन</strong></td><td>${c.reading.A}</td><td>${c.reading.B}</td><td>${c.reading.C}</td><td>${c.reading.A+c.reading.B+c.reading.C}</td></tr>
                                <tr><td><strong>लेखन</strong></td><td>${c.writing.A}</td><td>${c.writing.B}</td><td>${c.writing.C}</td><td>${c.writing.A+c.writing.B+c.writing.C}</td></tr>
                                <tr><td><strong>संख्याज्ञान</strong></td><td>${c.numeracy.A}</td><td>${c.numeracy.B}</td><td>${c.numeracy.C}</td><td>${c.numeracy.A+c.numeracy.B+c.numeracy.C}</td></tr>
                                <tr><td><strong>गणितीय क्रिया</strong></td><td>${c.operations.A}</td><td>${c.operations.B}</td><td>${c.operations.C}</td><td>${c.operations.A+c.operations.B+c.operations.C}</td></tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
        });

        if (summaryHTML !== '') {
            const gt = grandTotal;
            summaryHTML += `
                <div class="grand-total-block">
                    <h4>सर्व इयत्तांचा एकूण समारोप (Grand Total)</h4>
                    <table class="summary-table">
                        <thead><tr><th style="width: 20%;">विषय</th><th style="width: 20%;">गट A (प्रगत)</th><th style="width: 20%;">गट B (मध्यम)</th><th style="width: 20%;">गट C (आरंभिक)</th><th style="width: 20%;">एकूण नोंदणी</th></tr></thead>
                        <tbody>
                            <tr><td><strong>वाचन</strong></td><td>${gt.reading.A}</td><td>${gt.reading.B}</td><td>${gt.reading.C}</td><td>${gt.reading.A+gt.reading.B+gt.reading.C}</td></tr>
                            <tr><td><strong>लेखन</strong></td><td>${gt.writing.A}</td><td>${gt.writing.B}</td><td>${gt.writing.C}</td><td>${gt.writing.A+gt.writing.B+gt.writing.C}</td></tr>
                            <tr><td><strong>संख्याज्ञान</strong></td><td>${gt.numeracy.A}</td><td>${gt.numeracy.B}</td><td>${gt.numeracy.C}</td><td>${gt.numeracy.A+gt.numeracy.B+gt.numeracy.C}</td></tr>
                            <tr><td><strong>गणितीय क्रिया</strong></td><td>${gt.operations.A}</td><td>${gt.operations.B}</td><td>${gt.operations.C}</td><td>${gt.operations.A+gt.operations.B+gt.operations.C}</td></tr>
                        </tbody>
                    </table>
                </div>
            `;
        }
        document.getElementById('summaryContent').innerHTML = summaryHTML || '<p style="text-align:center;">विद्यार्थ्यांची इयत्ता निवडा.</p>';
    }

    document.getElementById('tableBody').addEventListener('change', function(e) {
        if(e.target && (e.target.classList.contains('competency-select') || e.target.classList.contains('class-dropdown'))) { generateSummary(); }
    });

    function gatherFormData() {
        const data = {
            school: document.getElementById('schoolSelect').value,
            teacher: document.getElementById('teacherSelect').value,
            date: document.getElementById('evalDate').value,
            center: document.getElementById('evalCenter').value,
            taluka: document.getElementById('evalTaluka').value,
            district: document.getElementById('evalDistrict').value,
            evalGroup: document.getElementById('classSelect').value,
            students: []
        };
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach(row => {
            const name = row.querySelector('.student-name').value;
            const cls = row.querySelector('.class-dropdown').value;
            if (name || cls) { 
                const selects = row.querySelectorAll('.competency-select');
                data.students.push({
                    name: name,
                    className: cls,
                    reading: selects[0].value,
                    writing: selects[1].value,
                    numeracy: selects[2].value,
                    operations: selects[3].value
                });
            }
        });
        return data;
    }

    function saveDataOffline() {
        const data = gatherFormData();
        localStorage.setItem('nipunEvalData', JSON.stringify(data));
        alert("माहिती ऑफलाइन सेव्ह झाली आहे! (Data saved offline successfully!)");
    }

    function loadDataOffline() {
        const dataStr = localStorage.getItem('nipunEvalData');
        if (!dataStr) {
            alert("कोणताही सेव्ह केलेला डेटा सापडला नाही. (No saved data found.)");
            return;
        }
        const data = JSON.parse(dataStr);
        
        document.getElementById('schoolSelect').value = data.school;
        onSchoolChange(); 
        document.getElementById('teacherSelect').value = data.teacher;
        document.getElementById('evalDate').value = data.date;
        document.getElementById('evalCenter').value = data.center;
        document.getElementById('evalTaluka').value = data.taluka;
        document.getElementById('evalDistrict').value = data.district;
        document.getElementById('classSelect').value = data.evalGroup;
        
        document.getElementById('tableSubtitle').innerText = (data.evalGroup === 'std2' ? 'इयत्ता २ री' : 'इयत्ता ३ री ते ५ वी') + ' | विषय क्षेत्रेः वाचन, लेखन, संख्याज्ञान, गणितीय क्रिया';
        document.getElementById('tableBody').innerHTML = '';
        rowCount = 0;

        data.students.forEach(student => {
            addRow();
            const lastRow = document.querySelector('#tableBody tr:last-child');
            lastRow.querySelector('.student-name').value = student.name;
            lastRow.querySelector('.class-dropdown').value = student.className;
            const selects = lastRow.querySelectorAll('.competency-select');
            selects[0].value = student.reading;
            selects[1].value = student.writing;
            selects[2].value = student.numeracy;
            selects[3].value = student.operations;
        });
        
        while(rowCount < 10) { addRow(); }
        generateSummary();
        alert("सेव्ह केलेला डेटा लोड झाला आहे! (Data loaded successfully!)");
    }

    function syncToSheet() {
        const pin = prompt("सिंक करण्यासाठी HM Admin PIN टाका (Enter Admin PIN):");
        if (pin !== HM_ADMIN_PIN) {
            alert("चुकीचा PIN! (Invalid PIN!) Access Denied.");
            return;
        }

        if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
            alert("तुम्ही अद्याप Google Script URL जोडलेली नाही. कृपया कोडमध्ये URL अपडेट करा.");
            return;
        }

        const data = gatherFormData();
        const syncButton = document.querySelector('.btn-sync');
        syncButton.innerText = "⏳ सिंक होत आहे...";
        syncButton.disabled = true;

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert("डेटा Google Sheet मध्ये यशस्वीरीत्या सिंक झाला! (Synced Successfully!)");
            syncButton.innerText = "☁️ Google Sheet सिंक";
            syncButton.disabled = false;
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert("सिंक करताना एरर आला. इंटरनेट तपासा.");
            syncButton.innerText = "☁️ Google Sheet सिंक";
            syncButton.disabled = false;
        });
    }

    // PDF Preparation Script for Perfect Text Wrapping
    function prepareForPDF() {
        const inputs = document.querySelectorAll('.form-header input, .form-header select, #tableBody input, #tableBody select');
        inputs.forEach(el => {
            const span = document.createElement('span');
            span.className = 'print-span';
            let text = '';
            if (el.tagName === 'SELECT') {
                text = el.options[el.selectedIndex] ? el.options[el.selectedIndex].text : '';
                if(text.includes('--') || text.includes('-निवडा-')) text = '';
            } else {
                text = el.value;
            }
            span.textContent = text;
            el.style.display = 'none';
            el.parentNode.insertBefore(span, el.nextSibling);
        });
    }

    function cleanupAfterPDF() {
        document.querySelectorAll('.print-span').forEach(el => el.remove());
        document.querySelectorAll('.form-header input, .form-header select, #tableBody input, #tableBody select').forEach(el => {
            el.style.display = '';
        });
    }

    function downloadPDF() {
        prepareForPDF();
        window.print();
        // Uses a timeout to ensure cleanup happens after the print dialog resolves
        setTimeout(cleanupAfterPDF, 500); 
    }

    window.addEventListener('afterprint', cleanupAfterPDF);

    window.onload = () => {
        populateSchoolDropdown();
        updateClass();
    };
</script>
